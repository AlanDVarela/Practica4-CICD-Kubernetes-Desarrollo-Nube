apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: practica4
  region: us-east-1

iam:
  serviceRoleARN: arn:aws:iam::090808597351:role/LabRole

managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    minSize: 1
    maxSize: 3
    desiredCapacity: 2
